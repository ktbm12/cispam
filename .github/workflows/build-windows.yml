name: Build Windows Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permet de lancer la compilation manuellement depuis l'interface GitHub

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: cispam

    env:
      DJANGO_SETTINGS_MODULE: config.settings.desktop
      DATABASE_URL: sqlite:///db.sqlite3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv (Fast Python Package Installer)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller pywebview waitress whitenoise

      - name: Collect Static Files
        env:
          DJANGO_SETTINGS_MODULE: config.settings.desktop
          DATABASE_URL: sqlite:///db.sqlite3
        run: |
          uv run python manage.py collectstatic --noinput

      - name: Verify spec file exists
        run: |
          echo "Checking cispam.spec..."
          Get-Item cispam.spec

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller cispam.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: CISPAM-Installer
          path: cispam/dist/installer/CISPAM_Setup.exe
