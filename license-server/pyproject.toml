[project]
name = "cispam-license-server"
version = "0.1.0"
description = "License activation/validation server and admin dashboard for the CISPAM desktop app"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"

dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography>=43.0.0",
  "django==6.0.7",
  "django-environ==0.14.0",
  "django-ratelimit==4.1.0",
  "djangorestframework==3.16.1",
  "gunicorn==26.0.0",
  "psycopg-binary==3.3.4",
  "redis==8.0.1",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "factory-boy==3.3.3",
  "pytest==9.1.1",
  "pytest-django==4.12.0",
  "ruff==0.15.22",
]

[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.ruff]
extend-exclude = [
  "*/migrations/*.py",
]
lint.select = ["E", "F", "I", "UP", "B", "S", "DJ"]
lint.ignore = ["S101"]
lint.isort.force-single-line = true
