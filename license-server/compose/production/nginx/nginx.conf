# TODO: replace with the real domain this service will be deployed to.
# Must match the DOMAIN value used in scripts/init-letsencrypt.sh.
server {
    listen 80;
    server_name license.cispam.org;

    # Certbot's HTTP-01 challenge (webroot mode) — must stay reachable over
    # plain HTTP even after TLS is set up, since renewal reuses this path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name license.cispam.org;

    ssl_certificate     /etc/letsencrypt/live/license.cispam.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.cispam.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2M;

    location / {
        proxy_pass http://django:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}
